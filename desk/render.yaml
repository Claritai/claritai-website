# Render blueprint for Claritai Desk (internal CRM).
# In Render: New +  →  Blueprint  →  point at this repo.
# Set the secret env vars (marked sync:false) in the dashboard after creation.
databases:
  - name: claritai-desk-db
    plan: 0.1c-256mb
    databaseName: claritai_desk
    user: claritai_desk

services:
  # The Desk web app: Google sign-in + CRM API + UI.
  - type: web
    name: claritai-desk
    runtime: node
    rootDir: desk
    plan: starter
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    # Uploaded documents live on a persistent disk rather than in the database.
    # Note: a service with a disk restarts rather than rolling over on deploy,
    # so expect a few seconds' downtime when you push. Fine for an internal tool.
    disk:
      name: desk-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claritai-desk-db
          property: connectionString
      - key: ALLOWED_DOMAIN
        value: claritai.ie
      - key: FILES_DIR
        value: /var/data/files
      # BASE_URL is deliberately left out until desk.claritai.ie is live.
      # Without it the app uses whichever hostname it was reached on, so you can
      # test on the .onrender.com URL first. Add it in the dashboard once DNS is
      # done:  BASE_URL = https://desk.claritai.ie
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # Hourly uptime + SSL check for every site in the Live sites tab.
  - type: cron
    name: claritai-desk-site-check
    runtime: node
    rootDir: desk
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: node cron/check-sites.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claritai-desk-db
          property: connectionString
      # Alert email. Without RESEND_API_KEY the monitor still runs and still
      # records everything — it just logs the alert instead of sending it.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM
        value: Claritai Desk <desk@claritai.ie>
      - key: BASE_URL
        value: https://desk.claritai.ie
      # ALERT_EMAILS is optional: leave it unset and alerts go to everyone who
      # has signed in to Desk. Set it (comma-separated) to override.

  # Raises the to-dos nobody got round to writing: leads gone quiet, deals that
  # have stopped moving, proposals with no answer, renewals coming up.
  # Once a day rather than hourly — a to-do list does not get more useful for
  # being rewritten every hour, and a morning list is one you actually read.
  # Render schedules in UTC, so this lands at 08:00 Irish time in summer and
  # 07:00 in winter. It sends nothing; it only writes to-dos.
  - type: cron
    name: claritai-desk-rules
    runtime: node
    rootDir: desk
    plan: starter
    schedule: "0 7 * * *"
    buildCommand: npm install
    startCommand: node cron/run-rules.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claritai-desk-db
          property: connectionString
