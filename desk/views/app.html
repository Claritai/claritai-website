<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Claritai Desk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* Claritai Desk — palette and type follow claritai.ie so the Desk reads as
   part of the same product, with a dark counterpart for late shifts. */
:root{
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --ground:#f1f7fc;
  --surface:#ffffff;
  --surface-2:#eef5fb;
  --surface-3:#e0edf8;
  --line:rgba(91,163,230,.20);
  --line-strong:rgba(91,163,230,.38);
  --ink:#1f2c3a;
  --ink-2:#5a6b7d;
  --ink-3:#8ba4bb;
  --accent:#3d8ed1;
  --accent-hover:#2e7cba;
  --accent-ink:#ffffff;
  --accent-soft:#e4f0fb;
  --ok:#127954;
  --ok-soft:#d9f0e7;
  --warn:#8d5c05;
  --warn-soft:#f8ecd4;
  --crit:#ab2f29;
  --crit-soft:#fadfdd;
  --shadow-sm:0 1px 2px rgba(46,124,186,.06);
  --shadow-md:0 1px 2px rgba(46,124,186,.06),0 10px 28px -14px rgba(46,124,186,.32);
  --shadow-lg:0 2px 6px rgba(46,124,186,.10),0 28px 60px -20px rgba(46,124,186,.40);
  --r-sm:6px; --r-md:10px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0c141d;
    --surface:#131f2a;
    --surface-2:#1a2733;
    --surface-3:#223340;
    --line:rgba(123,180,222,.16);
    --line-strong:rgba(123,180,222,.32);
    --ink:#e6eef6;
    --ink-2:#9db3c6;
    --ink-3:#6f8698;
    --accent:#6db4e6;
    --accent-hover:#8cc6ef;
    --accent-ink:#0c141d;
    --accent-soft:#16293a;
    --ok:#4fc394;
    --ok-soft:#0f2e26;
    --warn:#e0a93f;
    --warn-soft:#332810;
    --crit:#f0817a;
    --crit-soft:#3a1d1e;
    --shadow-sm:0 1px 2px rgba(0,0,0,.45);
    --shadow-md:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 28px 60px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0c141d;
  --surface:#131f2a;
  --surface-2:#1a2733;
  --surface-3:#223340;
  --line:rgba(123,180,222,.16);
  --line-strong:rgba(123,180,222,.32);
  --ink:#e6eef6;
  --ink-2:#9db3c6;
  --ink-3:#6f8698;
  --accent:#6db4e6;
  --accent-hover:#8cc6ef;
  --accent-ink:#0c141d;
  --accent-soft:#16293a;
  --ok:#4fc394;
  --ok-soft:#0f2e26;
  --warn:#e0a93f;
  --warn-soft:#332810;
  --crit:#f0817a;
  --crit-soft:#3a1d1e;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 28px 60px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);height:100dvh;overflow:hidden}

.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:18px 12px 12px;overflow:auto;
}
.brand{display:flex;align-items:baseline;gap:7px;padding:0 8px 18px;text-decoration:none}
.brand b{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.5px;color:#2e7cba}
.brand b i{font-style:normal;font-weight:700;background:linear-gradient(135deg,#3d8ed1 0%,#5ba3e6 50%,#6db4e6 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
:root[data-theme="dark"] .brand b{color:#8cc6ef}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand b{color:#8cc6ef}}
.brand span{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);font-weight:600}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border:0;background:transparent;border-radius:var(--r-md);
  color:var(--ink-2);font-weight:500;cursor:pointer;
}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .ic{width:16px;flex:none;opacity:.85}
.navbtn .tag{
  margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--ink-3);background:var(--surface-2);border-radius:999px;padding:1px 7px;
}
.navbtn[aria-current="true"] .tag{background:var(--surface);color:var(--accent)}
.navbtn .tag.alert{background:var(--crit-soft);color:var(--crit);font-weight:700}
.rail hr{border:0;border-top:1px solid var(--line);margin:12px 4px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.mechip{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left;width:100%;
}
.footrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px;flex-wrap:nowrap}
.footrow .conn{min-width:0;padding:0}
.footrow .conn span:not(.dot){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signout{font-size:11px;color:var(--ink-3);text-decoration:none;white-space:nowrap;flex:none}
.signout:hover{color:var(--accent);text-decoration:underline}
.avatar{
  width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;letter-spacing:.02em;
}
.mechip .who{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.mechip .who>span:last-child{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mechip .sub{font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.conn{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-3);padding:0 4px}
.conn .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.conn.off .dot{background:var(--warn)}

main{overflow:auto;display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:5;background:var(--ground);
  border-bottom:1px solid var(--line);padding:20px 26px 0;
}
.topbar .row1{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:22px}
.topbar .lede{color:var(--ink-2);font-size:13px;margin-top:3px;max-width:62ch}
.topbar .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.metastrip{display:flex;gap:0;flex-wrap:wrap;padding:14px 0 0;margin-top:14px;border-top:1px solid var(--line)}
.metastrip .m{padding:0 20px 14px;border-right:1px solid var(--line)}
.metastrip .m:first-child{padding-left:0}
.metastrip .m:last-child{border-right:0}
.metastrip .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);font-weight:600}
.metastrip .v{font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.metastrip .v.warn{color:var(--warn)} .metastrip .v.crit{color:var(--crit)} .metastrip .v.ok{color:var(--ok)}
.body{padding:22px 26px 60px;flex:1;min-width:0}

/* ---------- controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-md);
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--crit);border-color:var(--line)}
.btn.danger:hover{background:var(--crit-soft)}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=url],input[type=email],select,textarea{
  width:100%;padding:7px 10px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);
}
textarea{resize:vertical;min-height:70px;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
label.f{display:block}
label.f>span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- generic surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.panel>h3{
  font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-2);
  padding:14px 16px 0;font-family:var(--font-body);font-weight:700;
}
.panel .pbody{padding:12px 16px 16px}
.empty{color:var(--ink-3);font-size:13px;padding:18px 2px;text-align:center}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.01em;background:var(--surface-2);color:var(--ink-2);
}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.mono{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- overview ---------- */
.ovgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.barrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.barrow .bl{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bartrack{display:block;height:12px;background:var(--surface-2);border-radius:0 4px 4px 0;position:relative}
.barfill{display:block;height:12px;background:var(--accent);border-radius:0 4px 4px 0;min-width:3px}
.barrow .bv{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tline{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.tline:last-child{border-bottom:0}
.tline .when{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-3);width:66px;flex:none;
  padding-top:2px;font-variant-numeric:tabular-nums;
}
.tline .what{min-width:0;flex:1}
.tline .what b{font-weight:600;font-size:13px;display:block}
.tline .what small{color:var(--ink-3);font-size:11.5px}

/* ---------- pipeline board ---------- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{
  flex:none;width:252px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;
}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col>header{display:flex;align-items:center;gap:7px;padding:0 3px}
.col>header b{font-size:12px;font-weight:700;letter-spacing:.02em}
.col>header .n{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.col>header .stripe{width:3px;height:13px;border-radius:2px;background:var(--accent)}
.col.won>header .stripe{background:var(--ok)} .col.lost>header .stripe{background:var(--ink-3)}
.col .sum{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);padding:0 3px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px 11px;cursor:grab;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;
}
.card:hover{border-color:var(--line-strong)}
.card.dragging{opacity:.45}
.card .co{font-weight:600;font-size:13.5px;line-height:1.3}
.card .pn{font-size:12px;color:var(--ink-2)}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:1px}
.card .val{font-family:var(--font-mono);font-size:12px;font-weight:600}
.card .next{
  font-size:11.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:6px;
  display:flex;gap:6px;align-items:baseline;
}
.card .next.due{color:var(--crit)}

/* ---------- lists ---------- */
.grouphead{
  display:flex;align-items:center;gap:9px;margin:20px 0 8px;
  font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--ink-2);
}
.grouphead:first-child{margin-top:4px}
.grouphead .n{color:var(--ink-3);font-weight:600;letter-spacing:0}
.grouphead .rule{flex:1;height:1px;background:var(--line)}
.grouphead.crit{color:var(--crit)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;font-size:13.5px}
.row .s{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
.row.done .t{text-decoration:line-through;color:var(--ink-3);font-weight:400}
.check{
  width:17px;height:17px;flex:none;border-radius:5px;border:1.5px solid var(--line-strong);
  background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;
}
.check:hover{border-color:var(--accent)}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{opacity:0;width:11px;height:11px}
.check[aria-pressed="true"] svg{opacity:1}
.quickadd{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:9px 12px}
.quickadd input[type=text]{border:0;padding:4px 0;background:transparent}
.quickadd input[type=text]:focus{outline:none}
.quickadd select,.quickadd input[type=date]{width:auto;border-color:var(--line);background:var(--surface-2);font-size:12.5px}

/* ---------- sites ---------- */
.sitegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.site{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);
}
.site .sev{height:3px;background:var(--ok)}
.site.warn .sev{background:var(--warn)} .site.crit .sev{background:var(--crit)} .site.paused .sev{background:var(--ink-3)}
.site .inner{padding:13px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.site .h{display:flex;align-items:flex-start;gap:9px}
.site .h b{font-size:14px;font-weight:600;line-height:1.25}
.site .h .cl{font-size:11.5px;color:var(--ink-3)}
.site a.url{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.site a.url:hover{text-decoration:underline}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-family:var(--font-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.kv dd.crit{color:var(--crit)} .kv dd.warn{color:var(--warn)}
.issues{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:9px}
.issue{display:flex;gap:7px;align-items:flex-start;font-size:12px}
.issue .b{width:5px;height:5px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn)}
.issue.crit .b{background:var(--crit)}
.site .foot{display:flex;gap:6px;margin-top:auto;padding-top:4px}

/* ---------- lead demo toggle ---------- */
.demotoggle{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;flex:none;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-3);
  font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.demotoggle:hover{border-color:var(--accent);color:var(--accent)}
.demotoggle .box{
  width:13px;height:13px;border-radius:3px;border:1.5px solid currentColor;
  display:grid;place-items:center;font-size:9px;line-height:1;flex:none;
}
.demotoggle .box span{opacity:0}
.demotoggle[aria-pressed="true"]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.demotoggle[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.demotoggle[aria-pressed="true"] .box span{opacity:1}
.demotoggle.sent{background:var(--accent-soft);color:var(--accent)}
.demotoggle.sent .box{background:var(--accent);border-color:var(--accent)}
.demolink{font-size:11px;color:var(--accent);text-decoration:none;white-space:nowrap;flex:none}
.demolink:hover{text-decoration:underline}

/* ---------- customers ---------- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ccard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm);cursor:pointer;
}
.ccard:hover{border-color:var(--line-strong)}
.ccard .ch{display:flex;align-items:flex-start;gap:9px}
.ccard .ch b{font-size:15px;font-weight:600;line-height:1.25;flex:1;min-width:0}
.ccard .who{font-size:12px;color:var(--ink-3)}
.ccard .fee{display:flex;align-items:baseline;gap:6px}
.ccard .fee .amt{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ccard .fee .per{font-size:11.5px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface-2);
  color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;
}
.chip.off{opacity:.5;text-decoration:line-through}
.ccard .cfoot{
  display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:9px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);
}
.ccard .cfoot .warn{color:var(--warn);font-weight:600}
.ccard .cfoot .crit{color:var(--crit);font-weight:600}

/* repeatable rows inside the customer drawer */
.rowset{display:flex;flex-direction:column;gap:7px}
.rrow{display:flex;gap:6px;align-items:center}
.rrow input,.rrow select{padding:6px 8px;font-size:13px}
.rrow[data-row="contact"]{flex-wrap:wrap;padding-bottom:9px;border-bottom:1px dashed var(--line)}
.rrow[data-row="contact"]:last-child{border-bottom:0}
.rrow .del{
  flex:none;width:26px;height:30px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-3);border-radius:var(--r-sm);cursor:pointer;line-height:1;font-size:15px;
}
.rrow .del:hover{border-color:var(--crit);color:var(--crit)}
.addrow{
  align-self:flex-start;margin-top:2px;padding:4px 10px;font-size:12px;
  border:1px dashed var(--line-strong);background:transparent;color:var(--ink-2);
  border-radius:var(--r-sm);cursor:pointer;
}
.addrow:hover{border-color:var(--accent);color:var(--accent)}
.subhead{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  font-weight:700;margin:6px 0 -4px;padding-top:10px;border-top:1px solid var(--line);
}
.linked{display:flex;flex-direction:column;gap:0}
.linked a,.linked div.li{
  display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);
  font-size:13px;color:var(--ink);text-decoration:none;
}
.linked a:last-child,.linked div.li:last-child{border-bottom:0}
.linked a:hover{color:var(--accent)}
.linked small{color:var(--ink-3);font-size:11.5px;margin-left:auto;white-space:nowrap}

/* ---------- social ---------- */
.socgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.chline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chline:last-child{border-bottom:0}
.chan{
  width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-size:10px;font-weight:700;background:var(--surface-3);color:var(--ink-2);
}
.chline .g{flex:1;min-width:0}
.chline .g b{font-size:13px;font-weight:600;display:block}
.chline .g small{font-size:11px;color:var(--ink-3);font-family:var(--font-mono)}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,13,20,.42);z-index:40;backdrop-filter:blur(2px)}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:41;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;
}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:16px;flex:1;min-width:0}
.drawer .dbody{padding:16px 18px 26px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.modal{
  position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(460px,calc(100vw - 32px));max-height:86dvh;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
}
.modal .mb{padding:18px;display:flex;flex-direction:column;gap:13px}
.notes{display:flex;flex-direction:column;gap:0}
.note{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.note:last-child{border-bottom:0}
.note .nm{font-size:11px;color:var(--ink-3);font-family:var(--font-mono);margin-bottom:2px}
.banner{
  display:flex;align-items:center;gap:11px;padding:10px 14px;margin-bottom:16px;
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-md);
  background:var(--surface);font-size:12.5px;color:var(--ink-2);
}
.banner b{color:var(--ink)}
.banner .btn{margin-left:auto}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;
  font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);
}
[hidden]{display:none!important}

@media (max-width:900px){
  .ovgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100dvh}
  .rail{flex-direction:row;align-items:center;gap:6px;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;overflow-x:auto}
  .brand{padding:0 10px 0 2px}
  .navbtn{width:auto;white-space:nowrap}
  .navbtn .tag{margin-left:4px}
  .rail hr{display:none}
  .rail-foot{margin:0 0 0 auto;flex-direction:row;align-items:center;padding:0}
  .mechip{width:auto}.mechip .sub{display:none}
  .conn span:not(.dot){display:none}
  .topbar{padding:16px 16px 0}
  .body{padding:16px 16px 50px}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <nav class="rail">
    <a class="brand" href="https://claritai.ie"><b>clarit<i>ai</i></b><span>Desk</span></a>
    <button class="navbtn" data-view="overview"><span class="ic">◈</span>Overview</button>
    <button class="navbtn" data-view="leads"><span class="ic">◇</span>Leads<span class="tag" data-tag="leads"></span></button>
    <button class="navbtn" data-view="pipeline"><span class="ic">▤</span>Pipeline<span class="tag" data-tag="pipeline"></span></button>
    <button class="navbtn" data-view="clients"><span class="ic">◆</span>Customers<span class="tag" data-tag="clients"></span></button>
    <button class="navbtn" data-view="tasks"><span class="ic">✓</span>To-dos<span class="tag" data-tag="tasks"></span></button>
    <button class="navbtn" data-view="meetings"><span class="ic">◷</span>Meetings<span class="tag" data-tag="meetings"></span></button>
    <hr>
    <button class="navbtn" data-view="sites"><span class="ic">◉</span>Live sites<span class="tag" data-tag="sites"></span></button>
    <button class="navbtn" data-view="social"><span class="ic">◎</span>Social<span class="tag" data-tag="social"></span></button>
    <div class="rail-foot">
      <div class="mechip" id="mechip">
        <span class="avatar" id="meAv">–</span>
        <span class="who"><span class="sub">Signed in</span><span id="meName">…</span></span>
      </div>
      <div class="footrow">
        <div class="conn" id="conn"><span class="dot"></span><span>Connecting…</span></div>
        <a class="signout" href="/auth/logout">Sign out</a>
      </div>
    </div>
  </nav>

  <main>
    <div class="topbar">
      <div class="row1">
        <div>
          <h1 id="vTitle">Overview</h1>
          <div class="lede" id="vLede"></div>
        </div>
        <div class="acts" id="vActs"></div>
      </div>
      <div class="metastrip" id="vMeta"></div>
    </div>
    <div class="body" id="content"></div>
  </main>
</div>

<div id="layer"></div>

<script>
(function(){
"use strict";

/* ============ constants ============ */
const STAGES = [
  {id:"lead",        label:"New lead",      open:true},
  {id:"contacted",   label:"Contacted",     open:true},
  {id:"discovery",   label:"Discovery call",open:true},
  {id:"proposal",    label:"Proposal sent", open:true},
  {id:"negotiation", label:"Negotiation",   open:true},
  {id:"won",         label:"Won",           open:false},
  {id:"lost",        label:"Lost",          open:false}
];
const STAGE_LABEL = Object.fromEntries(STAGES.map(s=>[s.id,s.label]));
const SITE_STATUS = {
  ok:{label:"Healthy",cls:"ok"}, warn:{label:"Needs a look",cls:"warn"},
  crit:{label:"Down / urgent",cls:"crit"}, paused:{label:"Paused",cls:"paused"}
};
const SOCIAL_STATUS = {
  active:{label:"On schedule",cls:"ok"}, behind:{label:"Behind",cls:"warn"},
  paused:{label:"Paused",cls:""}, setup:{label:"Setting up",cls:"accent"}
};
const CHANNELS = ["Instagram","Facebook","LinkedIn","TikTok","X","YouTube","Google Business","Newsletter"];
const COLLS = ["leads","clients","deals","tasks","meetings","sites","social"];
const LEAD_STATUS = {
  new:{label:"To research",cls:""}, researching:{label:"Researching",cls:"accent"},
  contacted:{label:"Contacted",cls:"warn"}, promoted:{label:"In pipeline",cls:"ok"},
  dead:{label:"Not a fit",cls:""}
};
const FIT = {"":"Not rated", hot:"Good fit", warm:"Maybe", cold:"Long shot"};
const CLIENT_STATUS = {
  active:{label:"Active",cls:"ok"}, onboarding:{label:"Onboarding",cls:"accent"},
  paused:{label:"Paused",cls:"warn"}, former:{label:"Former",cls:""}
};
const CADENCE = {monthly:"per month", yearly:"per year", once:"one-off"};

/* ============ state ============ */
const data = {leads:[],clients:[],deals:[],tasks:[],meetings:[],sites:[],social:[]};
let team = [];              // staff who have signed in, from the server
let view = "overview";
let me = "";                // display name of the signed-in user
let meEmail = "";
let overlay = null;
let dirty = 0;              // in-flight writes; pause polling while they settle

/* ============ helpers ============ */
const $ = s=>document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money = n => (Number(n)||0).toLocaleString("en-IE",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const initials = n => String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
// Most of what the studio sells has two shapes: a one-off build and a monthly
// fee. Showing them as one blended number would flatter both, so they stay
// side by side wherever a total appears.
function moneyPair(once, monthly){
  once = Number(once)||0; monthly = Number(monthly)||0;
  if(!monthly) return money(once);
  if(!once) return money(monthly)+"/mo";
  return money(once)+" + "+money(monthly)+"/mo";
}
const sumMonthly = list => list.reduce((a,d)=>a+(Number(d.monthlyValue)||0),0);

function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function dayDiff(iso){
  if(!iso) return null;
  const a = new Date(iso.slice(0,10)+"T00:00:00");
  const b = new Date(todayISO()+"T00:00:00");
  return Math.round((a-b)/864e5);
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso.length<=10 ? iso+"T00:00:00" : iso);
  if(isNaN(d)) return "—";
  return d.toLocaleDateString("en-IE",{day:"numeric",month:"short"});
}
function fmtWhen(iso){
  if(!iso) return "—";
  const d = new Date(iso); if(isNaN(d)) return "—";
  return d.toLocaleDateString("en-IE",{weekday:"short",day:"numeric",month:"short"})+" · "+
         d.toLocaleTimeString("en-IE",{hour:"numeric",minute:"2-digit"});
}
function relDay(iso){
  const n = dayDiff(iso);
  if(n===null) return "";
  if(n===0) return "today"; if(n===1) return "tomorrow"; if(n===-1) return "yesterday";
  return n<0 ? Math.abs(n)+"d overdue" : "in "+n+"d";
}
function ago(iso){
  const n = dayDiff(iso);
  if(n===null) return "";
  if(n===0) return "today"; if(n===-1) return "yesterday"; if(n===1) return "tomorrow";
  return n<0 ? Math.abs(n)+"d ago" : "in "+n+"d";
}
function agoTime(iso){
  if(!iso) return "";
  const t = new Date(iso); if(isNaN(t)) return "";
  const mins = Math.round((Date.now()-t.getTime())/6e4);
  if(mins < 2) return "just now";
  if(mins < 60) return mins+"m ago";
  const hrs = Math.round(mins/60);
  if(hrs < 36) return hrs+"h ago";
  return Math.round(hrs/24)+"d ago";
}
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

/* ============ persistence ============ */
/* Writes go straight to the server and are also applied locally so the screen
   never lags behind the click. Polling picks up what teammates change. */
function setConn(state, label){
  const c = $("#conn");
  if(!c) return;
  c.classList.toggle("off", state !== "ok");
  c.lastElementChild.textContent = label;
}

async function api(method, path, body){
  const res = await fetch(path, {
    method,
    headers: body ? {"Content-Type":"application/json"} : undefined,
    body: body ? JSON.stringify(body) : undefined,
    credentials: "same-origin"
  });
  if(res.status === 401){ location.href = "/login?next=" + encodeURIComponent(location.pathname); throw new Error("signed out"); }
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.status === 204 ? null : res.json();
}

async function save(coll, rec){
  const i = data[coll].findIndex(x=>x.id===rec.id);
  if(i>=0) data[coll][i]=rec; else data[coll].push(rec);
  render();
  dirty++;
  try{
    await api("PUT", "/api/"+coll+"/"+encodeURIComponent(rec.id), rec);
    setConn("ok","Saved");
    setTimeout(()=>setConn("ok","Shared with your team"), 1200);
  }catch(e){
    setConn("off","Not saved — check your connection");
    toast("Couldn't save that. Your connection may have dropped.");
  }finally{ dirty--; }
}

async function remove(coll, id){
  const prev = data[coll].slice();
  data[coll] = data[coll].filter(x=>x.id!==id);
  render();
  dirty++;
  try{
    await api("DELETE", "/api/"+coll+"/"+encodeURIComponent(id));
  }catch(e){
    data[coll] = prev; render();
    toast("Couldn't delete that.");
  }finally{ dirty--; }
}

function byId(coll,id){ return data[coll].find(x=>x.id===id); }

/* ============ derived ============ */
const openDeals   = ()=> data.deals.filter(d=>d.stage!=="won" && d.stage!=="lost");
const openTasks   = ()=> data.tasks.filter(t=>!t.done);
const dueTasks    = ()=> openTasks().filter(t=>t.due && dayDiff(t.due)<=0);
const upcoming    = ()=> data.meetings.filter(m=>m.start && new Date(m.start)>=new Date(Date.now()-36e5)).sort((a,b)=>a.start.localeCompare(b.start));
const siteAlerts  = ()=> data.sites.filter(s=>s.status==="warn"||s.status==="crit");
const socialBehind= ()=> data.social.filter(s=>s.status==="behind");
const hasSample   = ()=> COLLS.some(c=>data[c].some(r=>r.sample));

/* ---- leads ---- */
// "Open" means still worth a look: not yet promoted into the pipeline, not parked.
const openLeads = ()=> data.leads.filter(l=>l.status!=="promoted" && l.status!=="dead");
function promotedThisYear(){
  const y = new Date().getFullYear();
  return data.leads.filter(l=>l.status==="promoted" && l.promotedAt &&
    new Date(l.promotedAt).getFullYear()===y);
}

/* ---- customers ---- */
function clientById(id){ return id ? data.clients.find(c=>c.id===id) : null; }
// Records made before Customers existed carry a typed name; fall back to it so
// nothing looks blank while the linking is being tidied up.
function clientNameOf(rec){
  const c = clientById(rec.clientId);
  return c ? c.name : (rec.client || "");
}
const activeClients = ()=> data.clients.filter(c=>(c.status||"active")==="active" || c.status==="onboarding");

// A service priced yearly still contributes to the monthly figure; one-offs never do.
function monthlyOf(client){
  return ((client && client.services) || [])
    .filter(s=>s.active!==false)
    .reduce((a,s)=>{
      const amt = Number(s.amount)||0;
      if(s.cadence==="yearly") return a + amt/12;
      if(s.cadence==="once")   return a;
      return a + amt;
    },0);
}
const mrr = ()=> activeClients().reduce((a,c)=>a+monthlyOf(c),0);
function renewalsDue(days){
  const win = days||60;
  return data.clients.filter(c=>{
    if(c.status==="former") return false;
    const d = c.contract && c.contract.renewalDate;
    if(!d) return false;
    const n = dayDiff(d);
    return n!==null && n<=win;
  });
}
/* ---- won business ---- */
// Deals won before wonAt was recorded fall back to when they were last touched,
// so historical records still land in a sensible year.
const wonAtOf = d => d.wonAt || d.updatedAt || d.createdAt || "";
function wonThisYear(){
  const y = new Date().getFullYear();
  return data.deals.filter(d=>d.stage==="won").filter(d=>{
    const t = wonAtOf(d); if(!t) return false;
    const dt = new Date(t);
    return !isNaN(dt) && dt.getFullYear() === y;
  });
}
const sumValue = list => list.reduce((a,d)=>a+(Number(d.value)||0),0);

const sitesOf  = id => data.sites.filter(s=>s.clientId===id);
const socialOf = id => data.social.filter(s=>s.clientId===id);
const dealsOf  = id => data.deals.filter(d=>d.clientId===id);
function linkedTasks(id){ return data.tasks.filter(t=>!t.done && (t.clientId===id || (t.dealId && (byId("deals",t.dealId)||{}).clientId===id))); }
function linkedMeetings(id){ return upcoming().filter(m=>m.clientId===id || (m.dealId && (byId("deals",m.dealId)||{}).clientId===id)); }

/* ============ nav ============ */
document.querySelectorAll(".navbtn").forEach(b=>{
  b.addEventListener("click",()=>{ view=b.dataset.view; closeOverlay(); render(); $("main").scrollTop=0; });
});

/* ============ render ============ */
function render(){
  document.querySelectorAll(".navbtn").forEach(b=>b.setAttribute("aria-current", String(b.dataset.view===view)));
  setTag("leads", openLeads().length);
  setTag("pipeline", openDeals().length);
  setTag("clients", activeClients().length, renewalsDue().length>0);
  setTag("tasks", openTasks().length, dueTasks().length>0);
  setTag("meetings", upcoming().length);
  setTag("sites", siteAlerts().length || data.sites.length, siteAlerts().length>0);
  setTag("social", socialBehind().length || data.social.length, socialBehind().length>0);

  const V = VIEWS[view];
  $("#vTitle").textContent = V.title;
  $("#vLede").textContent = V.lede;
  $("#vActs").innerHTML = V.actions();
  $("#vMeta").innerHTML = V.meta();
  $("#content").innerHTML = (hasSample()? sampleBanner() : "") + V.body();
  V.after && V.after();
}
function setTag(name,n,alert){
  const el = document.querySelector('[data-tag="'+name+'"]');
  if(!el) return;
  el.textContent = n||"";
  el.classList.toggle("alert", !!alert);
}
function sampleBanner(){
  return '<div class="banner"><span><b>Sample records loaded.</b> They are here so you can see how the desk works — clear them once your own data is in.</span>'+
    '<button class="btn sm" data-act="clear-sample">Clear sample data</button></div>';
}

/* ---------- OVERVIEW ---------- */
// Monthly-equivalent recurring revenue, grouped by what the service is called.
function revenueByService(){
  const map = {};
  activeClients().forEach(c=>(c.services||[]).filter(s=>s.active!==false).forEach(s=>{
    const amt = Number(s.amount)||0;
    const mo = s.cadence==="yearly" ? amt/12 : (s.cadence==="once" ? 0 : amt);
    if(!mo) return;
    const key = (s.label||"").trim() || "Unlabelled";
    map[key] = (map[key]||0) + mo;
  }));
  return Object.entries(map).map(([label,v])=>({label,v})).sort((a,b)=>b.v-a.v);
}
function stageValues(){
  return STAGES.filter(s=>s.open).map(s=>({
    label:s.label,
    n:data.deals.filter(d=>d.stage===s.id).length,
    v:data.deals.filter(d=>d.stage===s.id).reduce((a,d)=>a+(Number(d.value)||0),0)
  }));
}
const VIEWS = {};

function revenuePanel(){
  const rows = revenueByService();
  if(!rows.length){
    return '<section class="panel"><h3>Recurring revenue</h3><div class="pbody">'+
      '<div class="empty">No recurring services recorded yet. Open a customer and add what they pay each month.</div>'+
      '</div></section>';
  }
  const max = Math.max(1, ...rows.map(r=>r.v));
  const total = rows.reduce((a,r)=>a+r.v,0);
  const bars = rows.map(r=>
    '<div class="barrow" title="'+esc(r.label)+': '+money(r.v)+' per month">'+
      '<span class="bl">'+esc(r.label)+'</span>'+
      '<span class="bartrack"><span class="barfill" style="width:'+Math.max(3,Math.round(r.v/max*100))+'%"></span></span>'+
      '<span class="bv">'+money(r.v)+'</span>'+
    '</div>').join("");
  return '<section class="panel"><h3>Recurring revenue by service</h3><div class="pbody">'+bars+
    '<div class="tline" style="border:0;padding-top:10px"><span class="what"><small>'+
      money(total)+' a month across '+activeClients().length+' active customer'+(activeClients().length===1?"":"s")+
      ' · '+money(total*12)+' a year</small></span></div>'+
    '</div></section>';
}

VIEWS.overview = {
  title:"Overview",
  lede:"Where the studio stands right now — pipeline, commitments and anything asking for attention.",
  actions:()=>'<button class="btn" data-act="settings">Team</button>',
  meta(){
    const open = openDeals().reduce((a,d)=>a+(Number(d.value)||0),0);
    const od = dueTasks().length, al = siteAlerts().length;
    const monthly = mrr();
    const won = wonThisYear();
    return m([
      ["Monthly recurring", money(monthly), monthly?"ok":""],
      ["Won this year", moneyPair(sumValue(won), sumMonthly(won)), sumValue(won)||sumMonthly(won)?"ok":""],
      ["Open pipeline", money(open), ""],
      ["Tasks due or overdue", od, od?"warn":"ok"],
      ["Sites needing attention", al, al?"crit":"ok"],
      ["Meetings ahead", upcoming().length, ""]
    ]);
  },
  body(){
    const sv = stageValues();
    const anyOpen = openDeals().length > 0;
    const max = Math.max(1, ...sv.map(s=>s.v));
    const bars = !anyOpen ? '<div class="empty">Nothing in the pipeline right now. Add a deal and the funnel fills in here.</div>' : sv.map(s=>
      '<div class="barrow" title="'+esc(s.label)+': '+s.n+' deal'+(s.n===1?"":"s")+', '+money(s.v)+'">'+
        '<span class="bl">'+esc(s.label)+'</span>'+
        '<span class="bartrack"><span class="barfill" style="width:'+Math.max(2,Math.round(s.v/max*100))+'%"></span></span>'+
        '<span class="bv">'+money(s.v)+'</span>'+
      '</div>').join("");

    const week = [];
    upcoming().slice(0,6).forEach(mt=>{
      const who = (clientById(mt.clientId)||{}).name || (byId("deals",mt.dealId)||{}).company || "";
      week.push({t:new Date(mt.start),when:fmtDate(mt.start),b:mt.title,s:"Meeting"+(who?" · "+who:"")});
    });
    openTasks().filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6)
      .forEach(t=>week.push({t:new Date(t.due),when:fmtDate(t.due),b:t.title,s:"To-do · "+(t.owner||"Unassigned")+" · "+relDay(t.due)}));
    week.sort((a,b)=>a.t-b.t);
    const weekHtml = week.length ? week.slice(0,8).map(w=>
      '<div class="tline"><span class="when">'+esc(w.when)+'</span><span class="what"><b>'+esc(w.b)+'</b><small>'+esc(w.s)+'</small></span></div>').join("")
      : '<div class="empty">Nothing scheduled. Add a to-do or a meeting to fill this in.</div>';

    const att = [];
    siteAlerts().forEach(s=>att.push({p:s.status==="crit"?"crit":"warn",l:SITE_STATUS[s.status].label,b:s.name,s:(s.issues&&s.issues.filter(i=>!i.resolved)[0]||{}).text||"Flagged "+fmtDate(s.lastChecked)}));
    socialBehind().forEach(s=>att.push({p:"warn",l:"Behind",b:(clientNameOf(s)||"Unassigned")+" · "+s.channel,s:"Last post "+fmtDate(s.lastPost)}));
    openDeals().filter(d=>d.nextStepDate && dayDiff(d.nextStepDate)<0)
      .forEach(d=>att.push({p:"crit",l:"Follow-up late",b:d.company,s:(d.nextStep||"Next step")+" · "+relDay(d.nextStepDate)}));
    renewalsDue(45).forEach(c=>{
      const n = dayDiff(c.contract.renewalDate);
      att.push({p:n<0?"crit":"warn", l:n<0?"Renewal passed":"Renewal due", b:c.name,
                s:money(monthlyOf(c))+" per month · "+fmtDate(c.contract.renewalDate)+" · "+relDay(c.contract.renewalDate)});
    });
    const attHtml = att.length ? att.slice(0,8).map(a=>
      '<div class="tline"><span class="what"><b>'+esc(a.b)+'</b><small>'+esc(a.s)+'</small></span><span class="pill '+a.p+'"><span class="dot"></span>'+esc(a.l)+'</span></div>').join("")
      : '<div class="empty">Nothing flagged. Sites healthy, follow-ups on time.</div>';

    return '<div class="ovgrid">'+
      '<div class="stack">'+
        '<section class="panel"><h3>Open pipeline by stage</h3><div class="pbody">'+bars+
          (sumMonthly(openDeals()) ? '<div class="tline" style="border:0;padding-top:10px"><span class="what"><small>Bars show one-off value · a further '+
          money(sumMonthly(openDeals()))+' a month is riding on these deals</small></span></div>' : '')+
          (wonThisYear().length ? '<div class="tline" style="border:0;padding-top:'+(sumMonthly(openDeals())?'2px':'10px')+'"><span class="what"><small>Won this year · '+
          moneyPair(sumValue(wonThisYear()), sumMonthly(wonThisYear()))+' across '+wonThisYear().length+' deal'+(wonThisYear().length===1?"":"s")+
          '</small></span></div>' : '')+
        '</div></section>'+
        revenuePanel()+
        '<section class="panel"><h3>Next up</h3><div class="pbody">'+weekHtml+'</div></section>'+
      '</div>'+
      '<div class="stack">'+
        '<section class="panel"><h3>Wants attention</h3><div class="pbody">'+attHtml+'</div></section>'+
        '<section class="panel"><h3>Sites at a glance</h3><div class="pbody">'+
          (data.sites.length? data.sites.map(s=>
            '<div class="tline"><span class="what"><b>'+esc(s.name)+'</b><small>'+esc(clientNameOf(s)||"—")+' · checked '+fmtDate(s.lastChecked)+'</small></span>'+
            '<span class="pill '+SITE_STATUS[s.status||"ok"].cls+'"><span class="dot"></span>'+SITE_STATUS[s.status||"ok"].label+'</span></div>').join("")
            : '<div class="empty">No sites tracked yet.</div>')+
        '</div></section>'+
      '</div></div>';
  }
};

function addPastedLeads(){
  const raw = (overlay.querySelector("#plText").value||"").split("\n");
  const source = val("#plSource");
  const existing = new Set(data.leads.map(l=>(l.name||"").trim().toLowerCase()));
  let added = 0, skipped = 0;
  raw.forEach(line=>{
    const t = line.trim(); if(!t) return;
    const bits = t.split(",");
    const name = (bits[0]||"").trim();
    if(!name) return;
    if(existing.has(name.toLowerCase())){ skipped++; return; }
    existing.add(name.toLowerCase());
    let site = (bits[1]||"").trim();
    if(site && !/^https?:\/\//i.test(site)) site = "https://"+site;
    save("leads",{id:uid(),name,website:site,source,contact:"",email:"",phone:"",
      fit:"",status:"new",notes:"",demoBuilt:false,demoSent:false,demoUrl:"",value:0,monthlyValue:0,
      addedBy:me||"",addedAt:new Date().toISOString()});
    added++;
  });
  closeOverlay();
  toast(added+" lead"+(added===1?"":"s")+" added"+(skipped?", "+skipped+" already on the list":""));
}

// Promoting hands the lead to the Pipeline and leaves a record behind, so a
// scraped list never gets researched twice.
function promoteLead(id){
  const l = byId("leads",id); if(!l) return;
  const deal = {
    id: uid(),
    company: l.name, contact: l.contact||"", email: l.email||"", phone: l.phone||"",
    value: Number(l.value)||0, monthlyValue: Number(l.monthlyValue)||0, stage: "lead", owner: me||"",
    nextStep: "First contact", nextStepDate: "",
    source: l.source||"", clientId: "",
    notes: [{by:me||"Someone", at:new Date().toISOString(),
             text:"Promoted from Leads"+(l.source?" — found via "+l.source:"")+
                  (l.demoBuilt?". Demo site built"+(l.demoSent?" and sent":" (not sent yet)")+(l.demoUrl?": "+l.demoUrl:""):"")+
                  (l.notes?". "+l.notes:"")}],
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), wonAt:""
  };
  save("deals", deal);
  save("leads", Object.assign({}, l, {status:"promoted", promotedAt:new Date().toISOString(), dealId:deal.id}));
  closeOverlay();
  view = "pipeline"; render();
  openDeal(deal.id);
  toast("Moved into the Pipeline");
}

  body(){

      '<input type="text" id="qaText" placeholder="Add a to-do and press Enter…">'+
      '<select id="qaOwner">'+ownerOptions(me)+'</select>'+
      '<input type="date" id="qaDue" value="">'+
      '<button class="btn primary sm" data-act="qa-add">Add</button></div>';

    const groups = [
      {k:"Overdue",cls:"crit",f:t=>!t.done&&t.due&&dayDiff(t.due)<0},
      {k:"Today",cls:"",f:t=>!t.done&&t.due&&dayDiff(t.due)===0},
      {k:"Next 7 days",cls:"",f:t=>!t.done&&t.due&&dayDiff(t.due)>0&&dayDiff(t.due)<=7},
      {k:"Later",cls:"",f:t=>!t.done&&t.due&&dayDiff(t.due)>7},
      {k:"No date",cls:"",f:t=>!t.done&&!t.due}
    ];
    if(showDone) groups.push({k:"Done",cls:"",f:t=>t.done});
    let out = q;
    let any = false;
    groups.forEach(g=>{
      const list = data.tasks.filter(g.f).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
      if(!list.length) return;
      any = true;
      out += '<div class="grouphead '+g.cls+'">'+esc(g.k)+'<span class="n">'+list.length+'</span><span class="rule"></span></div>'+
        '<div class="rows">'+list.map(taskRow).join("")+'</div>';
    });
    if(!any) out += '<div class="empty" style="padding:44px 0">No to-dos yet. Add the first one above.</div>';
    return out;

    const t = $("#qaText");
    if(t){
      t.value = qaDraft;
      t.addEventListener("input",()=>{qaDraft=t.value;});
      t.addEventListener("keydown",e=>{ if(e.key==="Enter") addQuickTask(); });
    }
  }

function autoLabel(s){
  if(s.monitor===false) return "off";
  if(s.status==="paused") return "paused";
  if(!s.autoCheckedAt) return "next run, on the hour";
  const bits = [];
  bits.push(s.autoStatus==="crit" ? "failing" : (s.autoStatus==="warn" ? "flagged" : "responding"));
  if(s.httpStatus) bits.push("HTTP "+s.httpStatus);
  if(s.responseMs) bits.push(s.responseMs < 1000 ? s.responseMs+"ms" : (s.responseMs/1000).toFixed(1)+"s");
  bits.push(agoTime(s.autoCheckedAt));
  return bits.join(" · ");
}

  const st = SITE_STATUS[s.status||"ok"];
  const open = (s.issues||[]).filter(i=>!i.resolved);

  return '<article class="site '+st.cls+'" data-site="'+esc(s.id)+'">'+

      '<dl class="kv">'+

        '<dt>SSL expires</dt><dd'+(sslDays!==null&&sslDays<14?' class="crit"':'')+'>'+(s.sslExpiry?fmtDate(s.sslExpiry)+(sslDays!==null?" · "+sslDays+"d":""):"—")+'</dd>'+
        (s.platform?'<dt>Platform</dt><dd>'+esc(s.platform)+'</dd>':'')+
        '<dt>Auto-check</dt><dd class="'+(s.autoStatus==="crit"?"crit":(s.autoStatus==="warn"?"warn":""))+'">'+esc(autoLabel(s))+'</dd>'+
      '</dl>'+
      (open.length?'<div class="issues">'+open.map(i=>'<div class="issue '+(i.severity==="crit"?"crit":"")+'"><span class="b"></span><span>'+esc(i.text)+'</span></div>').join("")+'</div>':'')+

/* ============ overlays ============ */
function closeOverlay(){
  if(!overlay) return;
  overlay.remove(); overlay=null;
  document.removeEventListener("keydown",escClose);
}
function escClose(e){ if(e.key==="Escape") closeOverlay(); }
function shell(kind,inner){
  closeOverlay();
  const wrap = document.createElement("div");
  wrap.innerHTML = '<div class="scrim" data-close></div>'+inner;
  overlay = wrap;
  $("#layer").appendChild(wrap);
  wrap.querySelector("[data-close]").addEventListener("click",closeOverlay);
  document.addEventListener("keydown",escClose);
  const first = wrap.querySelector("input,select,textarea");
  first && first.focus();
  return wrap;
}

// Deleting a customer must not leave sites and channels pointing at nothing.
function deleteClient(id){
  ["sites","social","deals","tasks","meetings"].forEach(coll=>{
    data[coll].filter(r=>r.clientId===id).forEach(r=>{
      const copy = Object.assign({}, r); copy.clientId = "";
      save(coll, copy);

  });
  remove("clients", id);
  toast("Customer deleted — anything linked to them was unlinked, not removed");
}

    '<button class="btn" data-close>Not now</button>'+

  const rec = {
    id: uid(),
    name: deal.company || "Untitled",
    status: "onboarding",
    owner: deal.owner || me,
    contacts: deal.contact || deal.email || deal.phone
      ? [{name:deal.contact||"", role:"", email:deal.email||"", phone:deal.phone||""}] : [],
    services: [],
    billing: {email: deal.email||""},
    contract: {startDate: todayISO()},
    links: [],
    notes: "",
    activity: [{by:me||"Someone", at:new Date().toISOString(),
                text:"Created from the won deal — "+money(deal.value)+" at "+(deal.source||"unknown source")+"."}],
    createdAt: new Date().toISOString()
  };
  save("clients", rec);
  const d = Object.assign({}, deal, {clientId: rec.id});
  save("deals", d);
  view = "clients"; render();
  openClient(rec.id);
  toast("Customer created — add what they pay");
}

/* ============ export ============ */
function downloadCsv(name, head, rows){
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv = "﻿" + [head.map(q).join(",")].concat(rows.map(r=>r.map(q).join(","))).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = name+"-"+todayISO()+".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast("Exported");
}
function exportClients(){
  const head = ["Customer","Status","Looked after by","Main contact","Email","Phone",
                "Monthly EUR","Annual EUR","Services","Started","Renews","Sites","Channels","VAT"];
  downloadCsv("claritai-customers", head, data.clients.map(c=>{
    const p = (c.contacts||[])[0] || {};
    const k = c.contract||{}, b = c.billing||{};
    return [c.name, (CLIENT_STATUS[c.status||"active"]||{}).label, c.owner, p.name, p.email||b.email, p.phone,
            Math.round(monthlyOf(c)), Math.round(monthlyOf(c)*12),
            (c.services||[]).map(s=>s.label+" "+money(s.amount)+(s.cadence==="yearly"?"/yr":s.cadence==="once"?" once":"/mo")).join(" | "),
            k.startDate, k.renewalDate, sitesOf(c.id).length, socialOf(c.id).length, b.vat];
  }));
}
async function exportPipeline(){
  const head = ["Company","Contact","Email","Phone","One-off EUR","Monthly EUR","Stage","Owner","Next step","Next step due","Source"];
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv = "﻿" + [head.map(q).join(",")].concat(
    data.deals.map(d=>[d.company,d.contact,d.email,d.phone,d.value,d.monthlyValue||0,STAGE_LABEL[d.stage]||d.stage,d.owner,d.nextStep,d.nextStepDate,d.source].map(q).join(","))
  ).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = "claritai-pipeline-"+todayISO()+".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast("Pipeline exported");
}

/* ============ event delegation ============ */
document.addEventListener("click",e=>{
  const closer = e.target.closest("[data-close]");
  if(closer && overlay && overlay.contains(closer)){ closeOverlay(); return; }
  const ccard = e.target.closest("[data-client]");
  if(ccard && !e.target.closest("[data-act]")) return openClient(ccard.dataset.client);
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act;
  const row = b.closest("[data-lead],[data-task],[data-meeting],[data-site],[data-social]");

  if(act==="settings") return openTeam();

  if(act==="new-lead") return openLead(null);
  if(act==="lead-save") return saveLead();
  if(act==="lead-edit") return openLead(row.dataset.lead);
  if(act==="lead-promote") return promoteLead(row.dataset.lead);
  if(act==="lead-demo") return cycleDemo(row.dataset.lead);
  if(act==="lead-promote-drawer") return promoteLead(val("#lId"));
  if(act==="lead-delete"){ const id=val("#lId"); closeOverlay(); return remove("leads",id); }
  if(act==="la-add") return addQuickLead();
  if(act==="paste-leads") return openPasteLeads();
  if(act==="pl-add") return addPastedLeads();
  if(act==="toggle-dead"){ showDead=!showDead; return render(); }

  if(act==="new-client") return openClient(null);
  if(act==="client-save") return saveClient();
  if(act==="client-delete"){ const id=val("#cId"); closeOverlay(); return deleteClient(id); }
  if(act==="export-clients") return exportClients();
  if(act==="add-contact"){ overlay.querySelector("#cContacts").insertAdjacentHTML("beforeend", contactRow({})); return; }
  if(act==="add-service"){ overlay.querySelector("#cServices").insertAdjacentHTML("beforeend", serviceRow({})); return; }
  if(act==="add-link"){ overlay.querySelector("#cLinks").insertAdjacentHTML("beforeend", linkRow({})); return; }
  if(act==="row-del"){ b.closest(".rrow").remove(); recalcClientTotal(); return; }
  if(act==="convert-deal"){
    const d = byId("deals", val("#cvDealId")); closeOverlay();
    if(d) createClientFromDeal(d);
    return;
  }

  if(act==="new-deal") return openDeal(null);
  if(act==="deal-save") return saveDeal();
  if(act==="deal-delete"){ const id=val("#dId"); closeOverlay(); return remove("deals",id); }
  if(act==="export-pipeline") return exportPipeline();

  if(act==="qa-add") return addQuickTask();
  if(act==="toggle-done"){ showDone=!showDone; return render(); }
  if(act==="task-toggle"){
    const t = byId("tasks",row.dataset.task); if(!t) return;
    t.done = !t.done; t.doneAt = t.done? new Date().toISOString() : null; t.doneBy = t.done? (me||"") : "";
    return save("tasks",t);
  }
  if(act==="task-edit") return openTask(row.dataset.task);
  if(act==="task-save") return saveTask();
  if(act==="task-delete"){ const id=val("#tId"); closeOverlay(); return remove("tasks",id); }

  if(act==="new-meeting") return openMeeting(null);
  if(act==="meeting-edit") return openMeeting(row.dataset.meeting);
  if(act==="meeting-save") return saveMeeting();
  if(act==="meeting-delete"){ const id=val("#mId"); closeOverlay(); return remove("meetings",id); }

  if(act==="new-site") return openSite(null);
  if(act==="site-edit") return openSite(row.dataset.site);
  if(act==="site-save") return saveSite();
  if(act==="site-delete"){ const id=val("#sId"); closeOverlay(); return remove("sites",id); }
  if(act==="site-check") return logCheck(row.dataset.site);
  if(act==="check-save"){
    const s = byId("sites",val("#cId")); if(!s) return closeOverlay();
    s.status = val("#cStatus"); s.lastChecked = todayISO();
    const note = val("#cNote");
    if(note){
      s.issues = s.issues||[];
      if(s.status==="ok"){ s.notes = (fmtDate(todayISO())+" — "+note+"\n"+(s.notes||"")).trim(); }
      else s.issues.unshift({text:note,severity:s.status==="crit"?"crit":"warn",openedAt:new Date().toISOString(),by:me||"",resolved:false});
    }
    save("sites",s); closeOverlay(); return toast("Check recorded");
  }
  if(act==="issue-toggle"){
    const s = byId("sites",val("#sId")); if(!s) return;
    const i = Number(b.dataset.i); const iss = (s.issues||[])[i]; if(!iss) return;
    iss.resolved = !iss.resolved; iss.resolvedAt = iss.resolved? new Date().toISOString() : null;
    save("sites",s); openSite(s.id); return;
  }

  if(act==="new-social") return openSocial(null);
  if(act==="social-edit") return openSocial(row.dataset.social);
  if(act==="social-save") return saveSocial();
  if(act==="social-delete"){ const id=val("#oId"); closeOverlay(); return remove("social",id); }

  if(act==="clear-sample"){
    COLLS.forEach(c=>{ data[c].filter(r=>r.sample).forEach(r=>remove(c,r.id)); });
    return toast("Sample data cleared");
  }
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey) && e.key==="Enter" && overlay){
    const p = overlay.querySelector(".btn.primary"); p && p.click();
  }
});

/* ============ boot ============ */
$("#mechip").addEventListener("click", openTeam);
render();

async function refresh(){
  // Don't stomp on a record that is mid-save.
  if(dirty > 0) return;
  const payload = await api("GET", "/api/data");
  COLLS.forEach(c=>{ data[c] = payload[c] || []; });
  team = payload.team || [];
  render();
}

(async function boot(){
  try{
    const who = await api("GET", "/api/me");
    me = who.name || who.email.split("@")[0];
    meEmail = who.email;
    paintMe();
  }catch(e){ return; } // api() already redirected to the login screen

  try{
    await refresh();
    setConn("ok","Shared with your team");
  }catch(e){
    setConn("off","Couldn't load — retrying");
  }

  // Everyone works off the same records, so pick up teammates' changes on a
  // steady tick, and immediately when someone comes back to the tab.
  setInterval(()=>{ refresh().then(()=>setConn("ok","Shared with your team"))
                            .catch(()=>setConn("off","Reconnecting…")); }, 20000);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") refresh().catch(()=>{});
  });
})();
})();
</script>
