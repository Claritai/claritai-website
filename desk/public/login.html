<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Claritai Desk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#ffffff;
  --bg-secondary:#f4f8fc;
  --accent-blue:#3d8ed1;
  --accent-gradient:linear-gradient(135deg,#3d8ed1 0%,#5ba3e6 50%,#6db4e6 100%);
  --text-primary:#2e7cba;
  --text-secondary:#4f9ed4;
  --text-muted:#7bb4de;
  --ink:#1f2c3a;
  --ink-soft:#5a6b7d;
  --border-subtle:rgba(91,163,230,0.16);
  --border-accent:rgba(91,163,230,0.32);
  --font-display:'Sora',sans-serif;
  --font-body:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-body);
  background:var(--bg-secondary);
  color:var(--ink);
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:24px;
  -webkit-font-smoothing:antialiased;
}
.aura{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(680px 420px at 18% 8%, rgba(91,163,230,.16), transparent 70%),
  radial-gradient(620px 420px at 84% 92%, rgba(109,180,230,.14), transparent 70%);}
.card{
  position:relative;width:min(430px,100%);background:#fff;
  border:1px solid var(--border-subtle);border-radius:20px;
  padding:40px 36px 32px;text-align:center;
  box-shadow:0 1px 2px rgba(46,124,186,.05),0 26px 60px -28px rgba(46,124,186,.35);
}
.logo{
  font-family:var(--font-display);font-size:24px;font-weight:600;
  color:#2e7cba;text-decoration:none;letter-spacing:-.5px;display:inline-block;
}
.logo .ai{background:var(--accent-gradient);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;font-weight:700}
h1{
  font-family:var(--font-display);font-size:23px;font-weight:600;
  letter-spacing:-.4px;color:var(--ink);margin:22px 0 8px;
}
.sub{font-size:14.5px;color:var(--ink-soft);line-height:1.55;max-width:31ch;margin:0 auto}
.gbtn{
  display:flex;align-items:center;justify-content:center;gap:11px;
  width:100%;margin-top:28px;padding:13px 18px;
  background:#fff;border:1.5px solid var(--border-accent);border-radius:11px;
  font-family:var(--font-body);font-size:15px;font-weight:500;color:var(--ink);
  text-decoration:none;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s;
}
.gbtn:hover{border-color:var(--accent-blue);box-shadow:0 6px 18px -8px rgba(61,142,209,.5);transform:translateY(-1px)}
.gbtn:active{transform:translateY(0)}
.gbtn svg{width:19px;height:19px;flex:none}
.domain{
  margin-top:20px;padding-top:18px;border-top:1px solid var(--border-subtle);
  font-size:12.5px;color:var(--text-muted);line-height:1.6;
}
.domain b{color:var(--text-secondary);font-weight:600}
.err{
  margin-top:22px;padding:11px 14px;border-radius:10px;text-align:left;
  background:#fdf0ef;border:1px solid #f3cfcc;color:#a2352f;font-size:13px;line-height:1.5;
}
.bye{
  margin-top:22px;padding:11px 14px;border-radius:10px;text-align:left;
  background:#eef6fd;border:1px solid #cfe4f6;color:#2e7cba;font-size:13px;line-height:1.5;
}
.back{display:inline-block;margin-top:22px;font-size:13px;color:var(--text-muted);text-decoration:none}
.back:hover{color:var(--accent-blue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="aura"></div>
<main class="card">
  <a class="logo" href="https://claritai.ie">clarit<span class="ai">ai</span></a>
  <h1>Claritai Desk</h1>
  <p class="sub">Pipeline, to-dos, meetings and the sites we look after — in one place.</p>

  <div id="notice"></div>

  <a class="gbtn" href="/auth/google" id="signin">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span>Continue with Google</span>
  </a>

  <p class="domain">Staff only. Sign in with your <b id="dom">@claritai.ie</b> account —<br>personal accounts can't get in.</p>
  <a class="back" href="https://claritai.ie">← Back to claritai.ie</a>
</main>

<script>
(function(){
  var p = new URLSearchParams(location.search);
  var box = document.getElementById('notice');
  var messages = {
    domain: "That account isn't on the Claritai domain. Sign in with your @claritai.ie address instead.",
    denied: "Sign-in was cancelled. Try again when you're ready.",
    state: "That sign-in link expired. Start again from this page.",
    exchange: "Google couldn't complete the sign-in. Try again — if it keeps happening, tell Sean."
  };
  var err = p.get('error');
  if (err) {
    box.innerHTML = '<div class="err">' + (messages[err] || 'Sign-in failed. Please try again.') + '</div>';
  } else if (p.get('bye')) {
    box.innerHTML = '<div class="bye">You\'re signed out.</div>';
  }
  var next = p.get('next');
  if (next && next.charAt(0) === '/') {
    document.getElementById('signin').href = '/auth/google?next=' + encodeURIComponent(next);
  }
})();
</script>
</body>
</html>
